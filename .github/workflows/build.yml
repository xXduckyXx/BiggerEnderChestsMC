name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test the Paper plugin
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: EnderChestDB
          path: build/libs/EnderChestDB.jar
